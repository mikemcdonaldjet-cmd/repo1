name: Mikes-Weighted-Items-RAID-Analysis

on:
  schedule:
    # 5:30pm BST (UTC+1, April–October). Change to '30 17' for GMT (November–March).
    - cron: '30 16 * * 1-5'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run — analyse only, do not DM Mike'
        type: boolean
        default: false

jobs:
  weighted-items-analysis:
    name: Daily Weighted Items RAID Scan
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Weighted Items RAID Analysis
        uses: anthropics/claude-code-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          model: claude-opus-4-8
          timeout_minutes: '25'
          prompt_file: .github/prompts/weighted-items-agent.md
          mcp_config: |
            {
              "mcpServers": {
                "slack": {
                  "command": "npx",
                  "args": ["-y", "@modelcontextprotocol/server-slack"],
                  "env": {
                    "SLACK_BOT_TOKEN": "${{ secrets.SLACK_BOT_TOKEN }}"
                  }
                },
                "google-calendar": {
                  "command": "npx",
                  "args": ["-y", "@modelcontextprotocol/server-google-calendar"],
                  "env": {
                    "GOOGLE_CLIENT_ID": "${{ secrets.GOOGLE_CLIENT_ID }}",
                    "GOOGLE_CLIENT_SECRET": "${{ secrets.GOOGLE_CLIENT_SECRET }}",
                    "GOOGLE_REFRESH_TOKEN": "${{ secrets.GOOGLE_REFRESH_TOKEN }}"
                  }
                },
                "google-drive": {
                  "command": "npx",
                  "args": ["-y", "@modelcontextprotocol/server-google-drive"],
                  "env": {
                    "GOOGLE_CLIENT_ID": "${{ secrets.GOOGLE_CLIENT_ID }}",
                    "GOOGLE_CLIENT_SECRET": "${{ secrets.GOOGLE_CLIENT_SECRET }}",
                    "GOOGLE_REFRESH_TOKEN": "${{ secrets.GOOGLE_REFRESH_TOKEN }}"
                  }
                },
                "atlassian": {
                  "command": "npx",
                  "args": ["-y", "@atlassian/mcp-atlassian"],
                  "env": {
                    "ATLASSIAN_SITE_URL": "${{ secrets.ATLASSIAN_SITE_URL }}",
                    "ATLASSIAN_USER_EMAIL": "mike.mcdonald@justeattakeaway.com",
                    "ATLASSIAN_API_TOKEN": "${{ secrets.ATLASSIAN_API_TOKEN }}"
                  }
                }
              }
            }
